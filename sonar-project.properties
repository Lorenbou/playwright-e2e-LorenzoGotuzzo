sonar.projectKey=Lorenbou_playwright-e2e-LorenzoGotuzzo
sonar.organization=lorenbou
sonar.projectName=Playwright E2E - Lorenzo
sonar.projectVersion=1.0
sonar.sources=./src
sonar.sourceEncoding=UTF-8

# Fixtures (imagens, yml) nao sao codigo a ser analisado.
sonar.exclusions=src/support/fixtures/**

# O projeto contem apenas testes E2E com Playwright, sem codigo de aplicacao
# sob teste. Nao ha cobertura a ser medida, entao a metrica e excluida para que
# a condicao de coverage do Quality Gate nao seja avaliada.
sonar.coverage.exclusions=**/*
